name: Update recipe indexes

on:
  push:
    branches: [main]
    paths:
      - "Recipes/**"
      - ".github/scripts/generate-readme.sh"
      - ".github/workflows/readme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate recipe indexes
        run: .github/scripts/generate-readme.sh

      - name: Commit indexes if they changed
        run: |
          git add README.md Recipes/*/README.md
          if git diff --cached --quiet; then
            echo "Recipe indexes are already up to date."
            exit 0
          fi
          git config user.name "Stefan Herold"
          git config user.email "794372+Blackjacx@users.noreply.github.com"
          git commit -m "docs: regenerate recipe indexes"
          git push
